[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo_mysql", "php83Extensions.mbstring", "php83Extensions.xml", "php83Extensions.curl", "php83Extensions.tokenizer", "php83Extensions.dom", "php83Extensions.fileinfo", "php83Extensions.bcmath", "php83Extensions.ctype", "nodejs_20", "npm-9_x"]

[phases.install]
cmds = [
    "cp .env.example .env || true",
    "mkdir -p storage/framework/{sessions,views,cache}",
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci --prefer-offline"
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan package:discover --ansi || true"
]

[start]
cmd = "php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
