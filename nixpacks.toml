[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo_mysql", "php84Extensions.mbstring", "php84Extensions.xml", "php84Extensions.curl", "php84Extensions.tokenizer", "php84Extensions.dom", "php84Extensions.fileinfo", "php84Extensions.bcmath", "php84Extensions.ctype", "nodejs_20", "npm-9_x"]

[phases.install]
cmds = [
    "cp .env.example .env || true",
    "mkdir -p storage/framework/{sessions,views,cache}",
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci --prefer-offline"
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan package:discover --ansi || true"
]

[start]
cmd = "php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
